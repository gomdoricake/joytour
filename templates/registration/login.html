{% extends 'base.html' %}
{% block content %}
<style>
  /* 🖥️ [1] 기본 스타일 (미디어 쿼리 없이 기본값으로 PC 스타일을 선언합니다) */
  .report-container { 
    width: 100%;
    max-width: 420px; 
    margin: 80px auto; /* PC 화면 중앙에 카드 형태로 배치 */
    padding: 45px 40px; 
    font-family: sans-serif;
    background: #ffffff; 
    border-radius: 24px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06);
    box-sizing: border-box;
    position: static; 
  }

  .title { 
    font-size: 26px; 
    font-weight: 800; 
    color: #0f172a; 
    margin-top: 0;
    margin-bottom: 35px; 
    text-align: center; /* PC에서는 가운데 정렬 */
    letter-spacing: -0.5px;
  }
  
  .form-group p { 
    margin-bottom: 24px; 
    position: relative;
  }
  
  .form-group label { 
    display: block; 
    font-size: 11px; 
    font-weight: 700; 
    color: #64748b; 
    margin-bottom: 8px; 
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  
  .form-group input { 
    width: 100%; 
    padding: 14px 16px; 
    border: 1px solid #cbd5e1; 
    border-radius: 12px; 
    font-size: 15px; 
    font-weight: 600;
    color: #1e293b;
    box-sizing: border-box; 
    background: #ffffff; 
    transition: all 0.2s ease;
  }
  
  .form-group input:focus {
    border-color: #4f46e5;
    outline: none;
    box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
  }
  
  .btn-login { 
    display: block; 
    width: 100%; 
    padding: 16px; 
    background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
    color: #fff; 
    border: none; 
    border-radius: 14px; 
    font-size: 16px; 
    font-weight: 700; 
    cursor: pointer; 
    margin-top: 30px; 
    box-sizing: border-box;
    transition: all 0.25s ease;
    box-shadow: 0 4px 14px rgba(79, 70, 229, 0.2);
  }
  
  .btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
  }

  .errorlist {
    padding: 0;
    margin: 0 0 16px 0;
    list-style: none;
    font-size: 13px;
    color: #ef4444;
    font-weight: 600;
  }

  @media screen and (max-width: 450px) {
    .report-container {
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 !important;
      padding: 50px 24px 100px 24px !important; 
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
      background: #ffffff !important;
      box-sizing: border-box !important;
      min-height: calc(100vh - 57px) !important;
      position: relative !important; /* 모바일 전용 absolute 기준점 */
    }

    .title {
      text-align: left !important; /* 모바일에서는 왼쪽 정렬 */
      font-size: 26px !important;
      margin-bottom: 40px !important;
    }

    .form-group input {
      padding: 16px !important;
      font-size: 16px !important;
      background: #f8fafc !important;
      border: 1px solid #e2e8f0 !important;
    }

    .btn-login {
      position: absolute !important;
      bottom: 24px !important;
      left: 24px !important;
      right: 24px !important;
      width: calc(100% - 48px) !important;
      margin: 0 !important;
      padding: 16px !important;
      font-size: 16px !important;
      border-radius: 12px !important;
      transform: none !important;
      box-shadow: none !important;
    }
  }
</style>

<div class="report-container">
  <h2 class="title">Sign In</h2>

  <form method="post" autocomplete="off">
    {% csrf_token %}
    
    <div class="form-group">
      {{ form.as_p }}
    </div>

    <button type="submit" class="btn-login">로그인하기</button>
  </form>
</div>
{% endblock %}
