<form action="{% url 'create_guide' %}" method="post">
{% csrf_token %}
<fieldset>
    <legend><h1>Create Guide</h1></legend>
    <label for="name">Name:</label>
    <input type="text" name="name" id="name"><br>
    <label for="init_training_date">Initial Training Date:</label>
    <input type="date" name="init_training_date" id="init_training_date"><br>
    <label for="init_super_date">Initial Supervision Date:</label>
    <input type="date" name="init_super_date" id="init_super_date"><br>
    <label for="birth_date">Birth Date:</label>     
    <input type="date" name="birth_date" id="birth_date"><br>
    <label for="grade">Grade:</label>
    <input type="number" name="grade" id="grade"><br>
    <label for="abn">ABN:</label>
    <input type="text" name="abn" id="abn"><br>
    <label for="contact_info">Contact Info:</label>
    <textarea name="contact_info" id="contact_info"></textarea><br>
    <label for="address">Address:</label>
    <textarea name="address" id="address"></textarea><br>
    <label for="bank_account_name">Bank Account Name:</label>
    <input type="text" name="bank_account_name" id="bank_account_name"><br>
    <label for="bsb">BSB:</label>
    <input type="text" name="bsb" id="bsb"><br>
    <label for="account_number">Account Number:</label>
    <input type="text" name="account_number" id="account_number"><br>

</fieldset>
<input type="submit" value="Create Guide">
</form>
