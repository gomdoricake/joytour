<button onclick="window.location.href='{% url 'create_guide' %}'">Create Guide</button>
{% if latest_guides_list %}
<ul>
  {% for guide in latest_guides_list %}
  <li><a href="{% url 'guide_detail' guide.id %}">{{ guide.name }}</a></li>
  {% endfor %}
</ul>
{% else %}
<p>No guides are available.</p>
{% endif %}
