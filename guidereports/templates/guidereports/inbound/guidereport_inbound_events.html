{% if user.username != 'admin' %}
<p style="font-size: 18px; font-weight: bold; color: #4e73df; margin-bottom: 20px;">
  Guide Report - Inbound - Events
</p>
{% endif %}

<form method="post" id="real-event-form">
  {% csrf_token %} 
  {{ formset.management_form }} 
  
  {% if formset.errors %}
  <div style="color: red; margin-bottom: 15px;">{{ formset.errors }}</div>
  {% endif %}

  <div class="event-forms" id="event-form-list">
    {% for form in formset %}
    <div
      class="event-form-row"
      style="margin-bottom: 15px; padding: 15px; border: 1px solid #ccc; border-radius: 4px; position: relative;"
    >
      <h5 style="margin-top: 0; color: #333;">이벤트 #{{ forloop.counter }}</h5>
      
      {{ form.id }}
      
      {{ form.as_p }}

      <button
        type="button"
        class="remove-form-btn"
        style="
          position: absolute;
          top: 15px;
          right: 15px;
          padding: 3px 8px;
          background-color: #dc3545;
          color: white;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          z-index: 10;
        "
      >
        ❌ 삭제
      </button>
    </div>
    {% endfor %}
  </div>

  <button
    type="button"
    id="add-form-btn"
    style="
      margin-top: 10px;
      padding: 6px 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 20px;
    "
  >
    ➕ 이벤트 추가
  </button>

  <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;" />

  <button 
    type="submit" 
    id="submit-final-btn"
    style="padding: 10px 25px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;"
  >
    Next
  </button>
</form>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const formContainer = document.getElementById("event-form-list");
    const addButton = document.getElementById("add-form-btn");
    const mainForm = document.getElementById("real-event-form");
    const submitBtn = document.getElementById("submit-final-btn");
    const prefix = "{{ formset.prefix }}";

    // 1. ➕ [구조 개혁] 이벤트 항목 추가 버튼 클릭 핸들러
    addButton.addEventListener("click", function () {
      const currentFormCount = formContainer.getElementsByClassName("event-form-row").length;

      // 🌟 브라우저 렌더링 간섭을 피하기 위해 장고 empty_form을 안전한 문자열 템플릿으로 즉석 제조합니다.
      const rawTemplate = `
        <div class="event-form-row" style="margin-bottom: 15px; padding: 15px; border: 1px solid #ccc; border-radius: 4px; position: relative;">
          <h5 style="margin-top: 0; color: #333;">이벤트 #${currentFormCount + 1}</h5>
          {{ formset.empty_form.id }}
          {{ formset.empty_form.as_p }}
          <button type="button" class="remove-form-btn" style="position: absolute; top: 15px; right: 15px; padding: 3px 8px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 10;">❌ 삭제</button>
        </div>
      `;

      const processedHtml = rawTemplate.replace(/__prefix__/g, currentFormCount);

      const tempDiv = document.createElement("div");
      tempDiv.innerHTML = processedHtml.trim();
      const newRow = tempDiv.firstElementChild;

      // 새로 생성된 내부 인풋들 활성화 바인딩 점검
      const inputs = newRow.querySelectorAll("input, select, textarea");
      inputs.forEach((input) => {
        input.disabled = false;
        input.removeAttribute("readonly");
        if (input.type !== "hidden") {
          if (input.tagName === "SELECT") input.selectedIndex = 0;
          else input.value = "";
        }
      });

      formContainer.appendChild(newRow);
      
      // 장고 매니지먼트 폼 TOTAL_FORMS 강제 동기화
      const realTotalFormsInputs = document.querySelectorAll(`input[name="${prefix}-TOTAL_FORMS"]`);
      realTotalFormsInputs.forEach(input => {
        input.value = currentFormCount + 1;
        input.setAttribute("value", currentFormCount + 1);
      });
    });

    // 2. ❌ 이벤트 항목 삭제 버튼 클릭 핸들러
    formContainer.addEventListener("click", function (event) {
      if (event.target.classList.contains("remove-form-btn")) {
        const formRows = document.getElementsByClassName("event-form-row");
        
        if (formRows.length <= 1) {
          const inputs = formRows[0].querySelectorAll("input, select, textarea");
          inputs.forEach((input) => { 
            if (input.tagName === "SELECT") input.selectedIndex = 0; 
            else input.value = ""; 
          });
          alert("최소 한 개의 이벤트는 유지되어야 합니다."); 
          return;
        }

        event.target.closest(".event-form-row").remove();
        
        const remainingRows = document.getElementsByClassName("event-form-row");
        const realTotalFormsInputs = document.querySelectorAll(`input[name="${prefix}-TOTAL_FORMS"]`);
        realTotalFormsInputs.forEach(input => {
          input.value = remainingRows.length;
        });

        // 삭제 후 정렬 복구 공정
        for (let i = 0; i < remainingRows.length; i++) {
          const title = remainingRows[i].querySelector("h5");
          if (title) title.innerText = `이벤트 #${i + 1}`;

          const rowInputs = remainingRows[i].querySelectorAll("input, select, textarea");
          rowInputs.forEach((input) => {
            if (input.name) input.name = input.name.replace(new RegExp(`${prefix}-\\d+-`), `${prefix}-${i}-`);
            if (input.id) input.id = input.id.replace(new RegExp(`id_${prefix}-\\d+-`), `id_${prefix}-${i}-`);
          });
        }
      }
    });

    // 3. Next 버튼 클릭 시 중복 전송 방지
    mainForm.addEventListener("submit", function () {
      submitBtn.disabled = true;
      submitBtn.innerText = "Processing to Next Step...";
    });
  });
</script>
