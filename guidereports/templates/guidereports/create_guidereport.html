<form action="{% url 'guidereports:create_guidereport' %}" method="post">
  {% csrf_token %}
  <fieldset>
    <legend><h1>Create Guide Report</h1></legend>
    <label for="group_code">Group Code:</label>
    <input type="text" name="group_code" id="group_code" /><br />
    <label for="report_date">Report Date</label>
    <input type="date" name="report_date" id="report_date" /><br />
    <label for="guide_fee">Guide Fee</label>
    <input type="number" name="guide_fee" id="guide_fee" /><br />
    <label for="guide_exp">Guide Exp</label>
    <input type="number" name="guide_exp" id="guide_exp" /><br />
    <label for="attraction_exp">Attraction Exp</label>
    <input type="number" name="attraction_exp" id="attraction_exp" /><br />
    <label for="restaurant_exp">Restaurant Exp</label>
    <input type="number" name="restaurant_exp" id="restaurant_exp" /><br />
    <label for="fuel_exp">Fuel Exp</label>
    <input type="number" name="fuel_exp" id="fuel_exp" /><br />
    <label for="other_exp">Other Exp</label>
    <input type="number" name="other_exp" id="other_exp" /><br />
  </fieldset>
  <input type="submit" value="Create Guide Report" />
</form>
