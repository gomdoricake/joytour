<style>
  /* 🌟 화사하고 맑은 라이트 배경 일치 */
  body {
    background-color: #f8fafc;
    background-image: 
      radial-gradient(at 0% 0%, rgba(244, 63, 94, 0.04) 0px, transparent 50%), /* 경고 페이지라 indigo 대신 soft red 살짝 가미 */
      radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.04) 0px, transparent 50%);
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 🌟 화이트 글래스모피즘 경고 팝업 카드 */
  .delete-confirm-container {
    max-width: 480px;
    width: 90%;
    padding: 40px;
    font-family: sans-serif; /* 👈 깔끔하고 굵직한 이전 고딕 서체 통일 */
    background: rgba(255, 255, 255, 0.85); 
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
    text-align: center;
    box-sizing: border-box;
  }

  /* 🚨 경고 아이콘 플레이스홀더 무드 */
  .warning-icon-box {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    background-color: #fff1f2;
    color: #f43f5e;
    border-radius: 50%;
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 24px;
    border: 1px solid #ffe4e6;
  }

  /* 타이틀 스타일 */
  .delete-title {
    font-size: 20px;
    font-weight: 800;
    color: #0f172a;
    margin: 0 0 12px 0;
    letter-spacing: -0.5px;
    line-height: 1.4;
  }
  
  /* 타겟 강조 스팬 */
  .target-code {
    color: #f43f5e;
    background: #fff1f2;
    padding: 2px 8px;
    border-radius: 6px;
    border: 1px solid #ffe4e6;
    font-weight: 700;
  }

  /* 안내 서브 텍스트 */
  .delete-desc {
    font-size: 14px;
    color: #64748b;
    margin: 0 0 32px 0;
    line-height: 1.5;
  }

  /* 버튼 레이아웃 그룹 */
  .action-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* 🔥 시선을 사로잡는 파괴적인 삭제 버튼 */
  .btn-delete-submit {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%);
    color: #ffffff;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 12px rgba(244, 63, 94, 0.2);
    font-family: inherit;
  }
  .btn-delete-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(244, 63, 94, 0.35);
    background: linear-gradient(135deg, #fb7185 0%, #e11d48 100%);
  }

  /* ↩️ 안전하게 돌아가는 취소 버튼 */
  .btn-delete-cancel {
    display: block;
    width: 100%;
    padding: 14px;
    background: #f1f5f9;
    color: #475569;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    box-sizing: border-box;
    transition: all 0.2s ease;
  }
  .btn-delete-cancel:hover {
    background: #e2e8f0;
    color: #0f172a;
    border-color: #cbd5e1;
  }
</style>

{% extends 'base.html' %}
{% block content %}

<div class="delete-confirm-container">
  
  <div class="warning-icon-box">!</div>

  <h2 class="delete-title">
    정말로 <span class="target-code">{{ guidereport.group_code }}</span><br>리포트를 삭제하시겠습니까?
  </h2>
  
  <p class="delete-desc">
    삭제된 정산서 데이터 및 상세 청구 내역은<br>다시 복구할 수 없습니다.
  </p>

  <form method="POST" class="action-group">
    {% csrf_token %}
    <button type="submit" class="btn-delete-submit">네, 확실히 삭제합니다</button>
    <a href="{% url 'guidereports:detail' guidereport.pk %}" class="btn-delete-cancel">아니오, 취소하고 돌아갑니다</a>
  </form>
  
</div>

{% endblock %}
