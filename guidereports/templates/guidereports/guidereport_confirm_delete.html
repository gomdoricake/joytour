{% extends 'base.html' %}
{% block content %}

<style>
  /* 🌟 화면 중앙 정렬 래퍼 (부모 레이아웃 전용) */
  .delete-page-wrapper {
    width: 100%;
    min-height: calc(100vh - 120px); /* 화면 전체 높이 기준으로 중앙 배치 */
    display: flex;
    justify-content: center; /* 👈 가로 중앙 정렬 */
    align-items: center;     /* 👈 세로 중앙 정렬 */
    padding: 20px 16px;
    box-sizing: border-box;
  }

  /* 🌟 삭제 카드 메인 */
  .delete-confirm-container {
    max-width: 440px;
    width: 100%;
    margin: 0 auto; /* 👈 좌우 중앙 배치 보장 */
    padding: 36px 28px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #ffffff; 
    border-radius: 20px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    text-align: center;
    box-sizing: border-box;
  }

  /* 🚨 아이콘 박스 */
  .warning-icon-wrapper {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }

  .warning-icon-box {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    background-color: #fff1f2;
    color: #e11d48;
    border-radius: 50%;
    border: 1px solid #ffe4e6;
  }

  /* 타이틀 */
  .delete-title {
    font-size: 19px;
    font-weight: 800;
    color: #0f172a;
    margin: 0 0 12px 0;
    letter-spacing: -0.4px;
    line-height: 1.4;
  }
  
  /* 그룹 코드 강조 */
  .target-code {
    color: #e11d48;
    background: #fff1f2;
    padding: 2px 8px;
    border-radius: 6px;
    border: 1px solid #ffe4e6;
    font-weight: 700;
    display: inline-block;
  }

  /* 안내 서브 텍스트 카드 */
  .delete-desc-card {
    background: #f8fafc;
    border-radius: 12px;
    padding: 12px 14px;
    margin: 0 0 24px 0;
    border: 1px solid #f1f5f9;
  }

  .delete-desc {
    font-size: 13.5px;
    color: #64748b;
    margin: 0;
    line-height: 1.5;
    word-break: keep-all;
  }

  /* 버튼 영역 */
  .action-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn-delete-submit {
    width: 100%;
    padding: 14px;
    background: #f43f5e;
    color: #ffffff;
    border: none;
    border-radius: 12px;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease;
    font-family: inherit;
  }

  .btn-delete-submit:hover {
    background: #e11d48;
  }

  .btn-delete-cancel {
    display: block;
    width: 100%;
    padding: 13px;
    background: #ffffff;
    color: #475569;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    box-sizing: border-box;
    transition: all 0.2s ease;
  }

  .btn-delete-cancel:hover {
    background: #f8fafc;
    color: #0f172a;
  }

  /* 📱 모바일/태블릿 반응형 미디어 쿼리 (@media) */
  @media (max-width: 768px) {
    .delete-page-wrapper {
      min-height: auto;
      padding: 30px 12px;
    }

    .delete-confirm-container {
      padding: 24px 18px;
      border-radius: 16px;
    }

    .delete-title {
      font-size: 17px;
    }

    .delete-desc {
      font-size: 13px;
    }

    .btn-delete-submit, 
    .btn-delete-cancel {
      padding: 12px;
      font-size: 14px;
    }
  }
</style>

<!-- 🌟 전체 화면 정렬 래퍼 -->
<div class="delete-page-wrapper">
  <div class="delete-confirm-container">
    
    <!-- 🚨 아이콘 -->
    <div class="warning-icon-wrapper">
      <div class="warning-icon-box">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </div>
    </div>

    <h2 class="delete-title">
      정말로 <span class="target-code">{{ guidereport.group_code }}</span><br>리포트를 삭제하시겠습니까?
    </h2>
    
    <div class="delete-desc-card">
      <p class="delete-desc">
        삭제된 정산서 데이터 및 상세 청구 내역은<br><strong style="color: #e11d48;">다시 복구할 수 없습니다.</strong>
      </p>
    </div>

    <form method="POST" class="action-group">
      {% csrf_token %}
      <button type="submit" class="btn-delete-submit">네, 확실히 삭제합니다</button>
      <a href="{% url 'guidereports:detail' guidereport.pk %}" class="btn-delete-cancel">아니오, 취소하고 돌아갑니다</a>
    </form>
    
  </div>
</div>

{% endblock %}
