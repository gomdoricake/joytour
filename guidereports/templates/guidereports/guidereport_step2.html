<h2>가이드 리포트 생성</h2>
{% if user.username == 'admin' %}
어드민 가이드 등록
{% endif %}
{% if user.username != 'admin' %}
<p>
  Hi, {{ user.username }}! Please fill out the form below to create a guide report.
</p>
{% endif %}
<form method="post">
  {% csrf_token %}
  
  {% if form.errors %}
        <div style="color: red;">
            {{ form.errors }}
        </div>  
  {% endif %}
  {{ form.as_p }}

  <button type="submit">Submit Guide Report</button>
</form>
