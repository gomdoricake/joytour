<style>
  .admin-container { 
    max-width: 600px; 
    margin: 40px auto; 
    padding: 40px; 
    font-family: "Pretendard", sans-serif; 
    background: #ffffff; 
    border-radius: 20px; 
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04); 
  }
  .admin-header { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    margin-bottom: 35px; 
    padding-bottom: 15px;
    border-bottom: 2px solid #f8f9fa;
  }
  .title { 
    font-size: 22px; 
    font-weight: 800; 
    color: #1e293b; 
    margin: 0;
  }
  
  /* 🌟 상단 어드민 링크 버튼 고도화 */
  .admin-link { 
    padding: 10px 22px; 
    background: #4f46e5; /* 세련된 인디고 블루 */
    color: white; 
    border-radius: 10px; 
    text-decoration: none; 
    font-weight: 600; 
    font-size: 14px;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
  }
  .admin-link:hover {
    background: #4338ca;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(79, 70, 229, 0.25);
  }
  
  .guide-list { 
    list-style: none; 
    padding: 0; 
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 12px; /* 리스트 사이 간격 부여 */
  }

  /* 🌟 리스트 아이템을 '클릭 가능한 카드 버튼' 형태로 변경 */
  .guide-item { 
    padding: 0; /* 내부 a 태그가 영역을 다 채우도록 0으로 설정 */
    border-radius: 12px;
    background: #f8fafc; /* 밝고 투명한 그레이 background */
    border: 1px solid #e2e8f0;
    transition: all 0.2s ease-in-out;
  }
  
  /* 🌟 버튼 내부 링크 영역을 꽉 채워서 어디를 눌러도 클릭되게 처리 */
  .guide-item a { 
    display: flex;
    align-items: center;
    padding: 18px 20px; 
    text-decoration: none; 
    color: #334155; 
    font-weight: 600; 
    font-size: 15px; 
    width: 100%;
    box-sizing: border-box;
  }

  /* 🌟 그룹 코드 부분에 포인트 뱃지 효과 부여 */
  .code-badge {
    background: #e2e8f0;
    color: #475569;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    margin-right: 12px;
    font-family: monospace; /* 코드 형태 느낌 강조 */
  }

  .guide-name {
    color: #1e293b;
  }

  /* 🌟 마우스 올렸을 때 호버 액션 극대화 */
  .guide-item:hover { 
    background: #ffffff; 
    border-color: #4f46e5; /* 호버 시 어드민 버튼 컬러와 통일감 제공 */
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.04);
  }
  
  .guide-item:hover .code-badge {
    background: #e0e7ff;
    color: #4f46e5;
  }

  .no-data { 
    color: #94a3b8; 
    text-align: center; 
    padding: 40px 20px; 
    font-size: 15px;
  }
</style>

{% if request.user.username == 'admin' %}
<div class="admin-container">
  <div class="admin-header">
    <h2 class="title">Guidereport List</h2>
    <a href="{% url 'mypage:admin' %}" class="admin-link">Admin Page</a>
  </div>

  {% if guidereports %}
  <ul class="guide-list">
    {% for guidereport in guidereports %}
    <li class="guide-item">
      <a href="{% url 'guidereports:detail' guidereport.id %}">
        <span class="code-badge">{{ guidereport.group_code }}</span>
        <span class="guide-name">{{ guidereport.guide.name }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="no-data">No guidereports are available.</p>
  {% endif %}
</div>
{% endif %}
