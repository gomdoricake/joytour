{% extends 'base.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" type="text/css" href="{% static 'css/inbound_style.css' %}?v=1.1">


<div class="detail-actions">
    <a href="{% url 'inbound:index' %}" class="btn-back">&larr; Go to dashboard</a>
</div>


{% for guideinvoicetype in guideinvoicetype_list %}
    {{ guideinvoicetype.location }}
    ${{ guideinvoicetype.price}}
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#guideinvoicetypeModal-{{ guideinvoicetype.pk }}">
        Update
    </button>
    
    <div class="modal fade" id="guideinvoicetypeModal-{{ guideinvoicetype.pk }}" tabindex="-1" aria-labelledby="guideinvoicetypeModalLabel-{{ guideinvoicetype.pk }}" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form method="post" action="{% url 'invoices:update_guideinvoicetype' guideinvoicetype.pk %}">
                    {% csrf_token %}
                    <div class="modal-header">
                        <h5 class="modal-title" id="guideinvoicetypeModalLabel-{{ guideinvoicetype.pk }}">{{ guideinvoicetype.name }} Update</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body text-start">
                        <p>
                            <label>Location:</label>
                            <input type="text" name="location" value="{{ guideinvoicetype.location }}" class="form-control" required>
                        </p>
                        <p>
                            <label>Price: </label>
                            <input type="number" name="price" value="{{ guideinvoicetype.price }}" class="form-control" required>
                        </p>
                        
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Save changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <br>
{% endfor %}
<br>

<a href="{% url 'invoices:create_guideinvoicetype' %}">+ GuideInvoiceType</a>

{% endblock %}
